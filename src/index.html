<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moyo Header</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="header">
        <a href="#" class="header__logo">
            <img src="src/images/logo.png" alt="MOYO Logo">
        </a>

        <nav class="header__nav">
            <ul class="nav__list">
                <li class="nav__item"><a href="#" class="nav__link is-active">Home</a></li>
                <li class="nav__item"><a href="#" class="nav__link">Shop</a></li>
                <li class="nav__item"><a href="#" class="nav__link">About</a></li>
                <li class="nav__item"><a href="#" class="nav__link" data-qa="hover">Laptops & computers</a></li>
            </ul>
        </nav>

        <div class="header__cart">
            <span class="cart__icon">🛒</span>
            <span class="cart__text">Cart (0)</span>
        </div>
    </header>

</body>
</html>
